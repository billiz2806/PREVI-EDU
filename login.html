<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | PREVI-EDU</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.36.1/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="login-page">
  <main class="page page-center">
    <div class="container container-tight py-4">
      <div class="login-brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M3 10l9-5 9 5-9 5-9-5zm4 2.2V17c3 2 7 2 10 0v-4.8"></path></svg>
        </span>
        <span>PREVI-EDU</span>
      </div>

      <form class="card card-md login-card" id="login-form" novalidate>
        <div class="card-body">
          <h1 class="h2 text-center mb-4">Iniciar sesión</h1>

          <div class="mb-3">
            <label class="form-label" for="username">Usuario</label>
            <input class="form-control" id="username" name="username" type="text" autocomplete="username" required autofocus>
          </div>

          <div class="mb-3">
            <label class="form-label" for="password">Contraseña</label>
            <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
          </div>

          <div class="alert alert-danger d-none" id="login-error" role="alert"></div>

          <div class="form-footer">
            <button class="btn btn-primary w-100 login-button" type="submit">Iniciar sesión</button>
          </div>
          <p class="text-center text-secondary mt-3 mb-0">¿No tienes una cuenta? <button class="btn btn-link p-0 align-baseline" id="open-register" type="button">Registrarse</button></p>
        </div>
      </form>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/loader.js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
